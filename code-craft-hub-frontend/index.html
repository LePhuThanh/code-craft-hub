<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraftHub - Course Management</title>

    <style>

    </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>
    <h1>CodeCraftHub</h1>
    <p>Your Learning Management Platform</p>
</header>

<!-- ================= MAIN ================= -->

<main>

    <!-- ===== Add Course ===== -->

    <section id="course-form-section">

        <h2>Add New Course</h2>

        <form id="courseForm">

            <div>
                <label>Course Name</label>
                <input
                        type="text"
                        id="name"
                        required>
            </div>

            <div>
                <label>Description</label>
                <textarea
                        id="description"
                        rows="4"
                        required></textarea>
            </div>

            <div>
                <label>Target Date</label>
                <input
                        type="date"
                        id="targetDate"
                        required>
            </div>

            <div>
                <label>Status</label>

                <select
                        id="status"
                        required>

                    <option value="">Select Status</option>
                    <option>Not Started</option>
                    <option>In Progress</option>
                    <option>Completed</option>

                </select>

            </div>

            <button
                    type="submit"
                    id="saveButton">

                Add Course

            </button>

        </form>

    </section>

    <!-- ===== Course List ===== -->

    <section id="course-list-section">

        <h2>Course List</h2>

        <table id="courseTable">

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Description</th>

                <th>Target Date</th>

                <th>Status</th>

                <th>Created At</th>

                <th>Actions</th>

            </tr>

            </thead>

            <tbody id="courseTableBody">

            <!-- JavaScript Render -->

            </tbody>

        </table>

    </section>

</main>

<!-- ================= EDIT MODAL ================= -->

<div id="editModal">

    <div>

        <h2>Edit Course</h2>

        <form id="editForm">

            <input
                    type="hidden"
                    id="editId">

            <div>

                <label>Name</label>

                <input
                        type="text"
                        id="editName">

            </div>

            <div>

                <label>Description</label>

                <textarea
                        id="editDescription"
                        rows="4"></textarea>

            </div>

            <div>

                <label>Target Date</label>

                <input
                        type="date"
                        id="editTargetDate">

            </div>

            <div>

                <label>Status</label>

                <select id="editStatus">

                    <option>Not Started</option>
                    <option>In Progress</option>
                    <option>Completed</option>

                </select>

            </div>

            <button type="submit">

                Save

            </button>

            <button
                    type="button"
                    id="cancelEdit">

                Cancel

            </button>

        </form>

    </div>

</div>

<!-- ================= LOADING ================= -->

<div id="loading">

    Loading...

</div>

<!-- ================= TOAST ================= -->

<div id="toast">

</div>

<script>

</script>

</body>

</html>
