<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraftHub - Course Management</title>

    <style>

        :root{
            --primary:#8B5CF6;
            --primary-dark:#6D28D9;
            --amber:#F59E0B;
            --danger:#EF4444;
            --success:#10B981;

            --bg:#F5F3FF;
            --card:#FFFFFF;
            --border:#E5E7EB;

            --text:#1F2937;
            --text-light:#6B7280;

            --shadow:0 10px 25px rgba(0,0,0,.08);
            --radius:14px;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            background:var(--bg);
            color:var(--text);
        }

        header{

            background:linear-gradient(135deg,var(--primary),#A855F7);

            color:white;

            text-align:center;

            padding:40px 20px;

            box-shadow:var(--shadow);

        }

        header h1{

            font-size:34px;

        }

        header p{

            margin-top:8px;

            opacity:.9;

        }

        main{

            max-width:1200px;

            margin:40px auto;

            padding:20px;

        }

        section{

            background:var(--card);

            border-radius:var(--radius);

            box-shadow:var(--shadow);

            padding:25px;

            margin-bottom:35px;

        }

        section h2{

            margin-bottom:20px;

            color:var(--primary);

        }

        form{

            display:grid;

            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

            gap:18px;

        }

        form div{

            display:flex;

            flex-direction:column;

        }

        label{

            margin-bottom:8px;

            font-weight:600;

        }

        input,
        textarea,
        select{

            padding:12px;

            border:1px solid var(--border);

            border-radius:10px;

            font-size:15px;

            outline:none;

            transition:.25s;

        }

        input:focus,
        textarea:focus,
        select:focus{

            border-color:var(--primary);

            box-shadow:0 0 0 4px rgba(139,92,246,.15);

        }

        textarea{

            resize:vertical;

        }

        button{

            border:none;

            cursor:pointer;

            border-radius:10px;

            padding:12px 20px;

            color:white;

            font-weight:600;

            transition:.25s;

        }

        #saveButton{

            background:var(--primary);

        }

        #saveButton:hover{

            background:var(--primary-dark);

        }

        .edit-btn{

            background:var(--amber);

        }

        .edit-btn:hover{

            background:#D97706;

        }

        .delete-btn{

            background:var(--danger);

        }

        .delete-btn:hover{

            background:#DC2626;

        }

        button:hover{

            transform:translateY(-2px);

        }

        table{

            width:100%;

            border-collapse:collapse;

        }

        thead{

            background:var(--primary);

            color:white;

        }

        th,
        td{

            padding:14px;

            border-bottom:1px solid var(--border);

            text-align:left;

            vertical-align:top;

        }

        tbody tr:hover{

            background:#F9FAFB;

        }

        td button{

            margin-right:8px;

        }

        #editModal{

            animation:fadeIn .25s ease;

            position:fixed;

            inset:0;

            display:none;

            justify-content:center;

            align-items:center;

            background:rgba(0,0,0,.45);

            z-index:999;

        }

        #editModal>div{

            width:min(650px,92%);

            background:white;

            border-radius:18px;

            padding:30px;

            box-shadow:var(--shadow);

        }

        #loading{

            position:fixed;

            inset:0;

            display:none;

            justify-content:center;

            align-items:center;

            background:rgba(255,255,255,.65);

            backdrop-filter:blur(2px);

            z-index:1000;

            font-size:22px;

            font-weight:bold;

            color:var(--primary);

        }

        #loading::before{

            content:"";

            width:48px;

            height:48px;

            margin-right:15px;

            border-radius:50%;

            border:5px solid #DDD;

            border-top:5px solid var(--primary);

            animation:spin .8s linear infinite;

        }

        @keyframes spin{

            to{

                transform:rotate(360deg);

            }

        }

        #toast{

            position:fixed;

            right:25px;

            top:25px;

            min-width:280px;

            display:none;

            padding:16px 22px;

            color:white;

            border-radius:10px;

            box-shadow:var(--shadow);

            z-index:1200;

        }

        .toast-success{

            background:var(--success);

        }

        .toast-error{

            background:var(--danger);

        }

        @media(max-width:900px){

            table,
            thead,
            tbody,
            tr,
            th,
            td{

                display:block;

            }

            thead{

                display:none;

            }

            tr{

                background:white;

                border-radius:12px;

                margin-bottom:20px;

                box-shadow:var(--shadow);

                padding:15px;

            }

            td{

                border:none;

                padding:10px 0;

            }

            td::before{

                content:attr(data-label);

                display:block;

                color:var(--text-light);

                font-size:13px;

                margin-bottom:5px;

                font-weight:bold;

            }

        }

        @keyframes fadeIn{

            from{

                opacity:0;

                transform:scale(.95);

            }

            to{

                opacity:1;

                transform:scale(1);

            }

        }

    </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>
    <h1>CodeCraftHub</h1>
    <p>Your Learning Management Platform</p>
</header>

<!-- ================= MAIN ================= -->

<main>

    <!-- ===== Add Course ===== -->

    <section id="course-form-section">

        <h2>Add New Course</h2>

        <form id="courseForm">

            <div>
                <label>Course Name</label>
                <input
                        type="text"
                        id="name"
                        required>
            </div>

            <div>
                <label>Description</label>
                <textarea
                        id="description"
                        rows="4"
                        required></textarea>
            </div>

            <div>
                <label>Target Date</label>
                <input
                        type="date"
                        id="targetDate"
                        required>
            </div>

            <div>
                <label>Status</label>

                <select
                        id="status"
                        required>

                    <option value="">Select Status</option>
                    <option>Not Started</option>
                    <option>In Progress</option>
                    <option>Completed</option>

                </select>

            </div>

            <button
                    type="submit"
                    id="saveButton">

                Add Course

            </button>

        </form>

    </section>

    <!-- ===== Course List ===== -->

    <section id="course-list-section">

        <h2>Course List</h2>

        <table id="courseTable">

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Description</th>

                <th>Target Date</th>

                <th>Status</th>

                <th>Created At</th>

                <th>Actions</th>

            </tr>

            </thead>

            <tbody id="courseTableBody">

            <!-- JavaScript Render -->

            </tbody>

        </table>

    </section>

</main>

<!-- ================= EDIT MODAL ================= -->

<div id="editModal">

    <div>

        <h2>Edit Course</h2>

        <form id="editForm">

            <input
                    type="hidden"
                    id="editId">

            <div>

                <label>Name</label>

                <input
                        type="text"
                        id="editName">

            </div>

            <div>

                <label>Description</label>

                <textarea
                        id="editDescription"
                        rows="4"></textarea>

            </div>

            <div>

                <label>Target Date</label>

                <input
                        type="date"
                        id="editTargetDate">

            </div>

            <div>

                <label>Status</label>

                <select id="editStatus">

                    <option>Not Started</option>
                    <option>In Progress</option>
                    <option>Completed</option>

                </select>

            </div>

            <button type="submit">

                Save

            </button>

            <button
                    type="button"
                    id="cancelEdit">

                Cancel

            </button>

        </form>

    </div>

</div>

<!-- ================= LOADING ================= -->

<div id="loading">

    Loading...

</div>

<!-- ================= TOAST ================= -->

<div id="toast">

</div>

<script>

    const API_URL = "http://localhost:8080/api/courses";

    const tableBody = document.getElementById("courseTableBody");

    const loading = document.getElementById("loading");

    const toast = document.getElementById("toast");

    const courseForm = document.getElementById("courseForm");

    const editModal = document.getElementById("editModal");

    const editForm = document.getElementById("editForm");

    const cancelEdit = document.getElementById("cancelEdit");

    /* ================= Loading ================= */

    function showLoading() {

        loading.style.display = "flex";

    }

    function hideLoading() {

        loading.style.display = "none";

    }

    /* ================= Toast ================= */

    function showToast(message, success = true) {

        toast.textContent = message;

        toast.className = success
            ? "toast-success"
            : "toast-error";

        toast.style.display = "block";

        setTimeout(() => {

            toast.style.display = "none";

        }, 3000);

    }

    /* ================= Format Date ================= */

    function formatDate(date) {

        if (!date) {

            return "-";

        }

        return new Date(date).toLocaleString();

    }

    /* ================= Render ================= */

    function renderCourses(courses) {

        tableBody.innerHTML = "";

        if (courses.length === 0) {

            tableBody.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center;">
                    No courses found.
                </td>
            </tr>
        `;

            return;

        }

        courses.forEach(course => {

            tableBody.innerHTML += `

            <tr>

                <td data-label="ID">${course.id}</td>

                <td data-label="Name">${course.name}</td>

                <td data-label="Description">${course.description}</td>

                <td data-label="Target Date">${course.target_date}</td>

                <td data-label="Status">${course.status}</td>

                <td data-label="Created At">
                    ${formatDate(course.created_at)}
                </td>

                <td data-label="Actions">

                    <button
                        class="edit-btn"
                        onclick="editCourse(${course.id})">

                        Edit

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteCourse(${course.id})">

                        Remove

                    </button>

                </td>

            </tr>

        `;

        });

    }

    /* ================= GET ================= */

    async function loadCourses() {

        showLoading();

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {

                throw new Error("Unable to load courses.");

            }

            const courses = await response.json();

            renderCourses(courses);

        }
        catch (error) {

            showToast(error.message, false);

        }
        finally {

            hideLoading();

        }

    }

    /* ================= Placeholder ================= */

    async function editCourse(id) {

        showLoading();

        try {

            const response = await fetch(`${API_URL}/${id}`);

            if (!response.ok) {

                throw new Error("Unable to load course.");

            }

            const course = await response.json();

            document.getElementById("editId").value = course.id;

            document.getElementById("editName").value = course.name;

            document.getElementById("editDescription").value = course.description;

            document.getElementById("editTargetDate").value = course.target_date;

            document.getElementById("editStatus").value = course.status;

            editModal.style.display = "flex";

        }
        catch (error) {

            showToast(error.message, false);

        }
        finally {

            hideLoading();

        }

    }

    cancelEdit.addEventListener("click", () => {

        editModal.style.display = "none";

    });

    editForm.addEventListener("submit", updateCourse);

    async function updateCourse(event) {

        event.preventDefault();

        const id = document.getElementById("editId").value;

        const course = {

            name: document.getElementById("editName").value.trim(),

            description: document.getElementById("editDescription").value.trim(),

            target_date: document.getElementById("editTargetDate").value,

            status: document.getElementById("editStatus").value

        };

        if (
            !course.name ||
            !course.description ||
            !course.target_date ||
            !course.status
        ) {

            showToast("Please complete all required fields.", false);

            return;

        }

        showLoading();

        try {

            const response = await fetch(`${API_URL}/${id}`, {

                method: "PUT",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify(course)

            });

            if (!response.ok) {

                const error = await response.json();

                throw new Error(error.error || "Unable to update course.");

            }

            editModal.style.display = "none";

            showToast("Course updated successfully.");

            await loadCourses();

        }
        catch (error) {

            showToast(error.message, false);

        }
        finally {

            hideLoading();

        }

    }

    async function deleteCourse(id) {

        const confirmed = confirm(
            "Are you sure you want to delete this course?"
        );

        if (!confirmed) {
            return;
        }

        showLoading();

        try {

            const response = await fetch(`${API_URL}/${id}`, {

                method: "DELETE"

            });

            if (!response.ok) {

                const error = await response.json();

                throw new Error(error.error || "Unable to delete course.");

            }

            showToast("Course deleted successfully.");

            await loadCourses();

        }
        catch (error) {

            showToast(error.message, false);

        }
        finally {

            hideLoading();

        }

    }

    /* ================= Start ================= */

    /* ================= POST ================= */

    courseForm.addEventListener("submit", createCourse);

    async function createCourse(event) {

        event.preventDefault();

        const course = {

            name: document.getElementById("name").value.trim(),

            description: document.getElementById("description").value.trim(),

            target_date: document.getElementById("targetDate").value,

            status: document.getElementById("status").value

        };

        if (
            !course.name ||
            !course.description ||
            !course.target_date ||
            !course.status
        ) {

            showToast("Please complete all required fields.", false);

            return;

        }

        showLoading();

        try {

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify(course)

            });

            if (!response.ok) {

                const error = await response.json();

                throw new Error(error.error || "Unable to create course.");

            }

            courseForm.reset();

            showToast("Course created successfully.");

            await loadCourses();

        }
        catch (error) {

            showToast(error.message, false);

        }
        finally {

            hideLoading();

        }

    }

    loadCourses();

</script>

</body>

</html>
